<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Workshop Registration Form</h1>
        <form id="registration-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>
                <select id="experience" name="experience">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            
            <div class="form-group">
                <span class="group-title">Workshop Track</span>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="track-frontend" name="track" value="frontend" checked>
                        <label for="track-frontend">Frontend Web</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="track-backend" name="track" value="backend">
                        <label for="track-backend">Backend APIs</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="track-design" name="track" value="design">
                        <label for="track-design">UI/UX Design</label>
                    </div>
                    </div>
            </div>

            <div class="form-group">
                <input type="checkbox" id="notifications" name="notifications">
                <label for="notifications">Send me event updates</label>
            </div>
            
            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
